<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashborad por Horário</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>Dashborad Diário</h1>
        <p>Status do dia baseado no horário!</p>
    </header>

    <main class="dashboard">
        <section class="card">
            <h2 id="periodo">Bom Dia!</h2>

            <img src="imagens/morning.png" alt="Imagem-dia" id="imagem">

            <p id="mensagem">bora acordar!</p>

            <button id="atualizar">Atualizar</button>
        </section>
    </main>
    
    <footer class="footer">
        <p>Projeto de estudo</p>
    </footer>

</body>
</html>
